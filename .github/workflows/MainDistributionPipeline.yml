#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    if: false   # extension-template is currently not compatible with main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: observefs

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@9c58e2d84a763d6b050a41157c82e98e55f5a163
    with:
      duckdb_version: v2.0.0
      ci_tools_version: 9c58e2d84a763d6b050a41157c82e98e55f5a163
      extension_name: observefs

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@9c58e2d84a763d6b050a41157c82e98e55f5a163
    with:
      duckdb_version: v2.0.0
      ci_tools_version: 9c58e2d84a763d6b050a41157c82e98e55f5a163
      extension_name: observefs
      format_checks: 'format;tidy'
